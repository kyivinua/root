syntax = "proto3";

package common.v1;

option go_package = "github.com/test/monorepo/gen/go/common/v1;commonv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ErrorCode represents standard error codes across all services
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_INTERNAL = 6;
  ERROR_CODE_UNAVAILABLE = 7;
  ERROR_CODE_UNAUTHENTICATED = 8;
}

// Status represents operation status
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_IN_PROGRESS = 2;
  STATUS_COMPLETED = 3;
  STATUS_FAILED = 4;
  STATUS_CANCELLED = 5;
}

// Priority levels for various operations
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_CRITICAL = 4;
}

// Metadata contains common metadata for all resources
message Metadata {
  // Unique identifier
  string id = 1;

  // Creation timestamp
  google.protobuf.Timestamp created_at = 2;

  // Last update timestamp
  google.protobuf.Timestamp updated_at = 3;

  // User who created the resource
  string created_by = 4;

  // User who last updated the resource
  string updated_by = 5;

  // Version for optimistic locking
  int64 version = 6;

  // Resource tags for organization
  map<string, string> tags = 7;

  // Soft delete timestamp
  google.protobuf.Timestamp deleted_at = 8;
}

// Address represents a physical or mailing address
message Address {
  // Street address line 1
  string street1 = 1;

  // Street address line 2 (optional)
  string street2 = 2;

  // City name
  string city = 3;

  // State or province
  string state = 4;

  // Postal or ZIP code
  string postal_code = 5;

  // Country code (ISO 3166-1 alpha-2)
  string country_code = 6;

  // Geographic coordinates
  GeoCoordinates coordinates = 7;
}

// GeoCoordinates represents latitude and longitude
message GeoCoordinates {
  // Latitude in degrees
  double latitude = 1;

  // Longitude in degrees
  double longitude = 2;
}

// Money represents a monetary amount
message Money {
  // Currency code (ISO 4217)
  string currency_code = 1;

  // Amount in smallest currency unit (e.g., cents)
  int64 amount = 2;

  // Human-readable formatted amount
  string display_value = 3;
}

// Pagination request parameters
message PaginationRequest {
  // Page number (1-indexed)
  int32 page = 1;

  // Number of items per page
  int32 page_size = 2;

  // Cursor for cursor-based pagination
  string cursor = 3;
}

// Pagination response metadata
message PaginationResponse {
  // Total number of items
  int64 total_count = 1;

  // Total number of pages
  int32 total_pages = 2;

  // Current page number
  int32 current_page = 3;

  // Next page cursor
  string next_cursor = 4;

  // Previous page cursor
  string prev_cursor = 5;

  // Whether there are more results
  bool has_more = 6;
}

// Error represents an error response
message Error {
  // Error code
  ErrorCode code = 1;

  // Human-readable error message
  string message = 2;

  // Additional error details
  map<string, string> details = 3;

  // Field-specific validation errors
  repeated FieldError field_errors = 4;

  // Unique error trace ID
  string trace_id = 5;
}

// FieldError represents a validation error on a specific field
message FieldError {
  // Field name
  string field = 1;

  // Error message for this field
  string message = 2;

  // Rejected value
  string rejected_value = 3;
}

// AuditLog represents an audit trail entry
message AuditLog {
  // Audit log metadata
  Metadata metadata = 1;

  // Action performed
  string action = 2;

  // Resource type affected
  string resource_type = 3;

  // Resource ID affected
  string resource_id = 4;

  // User who performed the action
  string user_id = 5;

  // IP address of the request
  string ip_address = 6;

  // User agent string
  string user_agent = 7;

  // Changes made (JSON serialized)
  string changes = 8;

  // Request metadata
  map<string, string> request_metadata = 9;
}

// HealthStatus represents service health
message HealthStatus {
  // Overall health status
  bool healthy = 1;

  // Component-specific health checks
  map<string, ComponentHealth> components = 2;

  // Timestamp of health check
  google.protobuf.Timestamp checked_at = 3;
}

// ComponentHealth represents health of a specific component
message ComponentHealth {
  // Component name
  string name = 1;

  // Is component healthy
  bool healthy = 2;

  // Status message
  string message = 3;

  // Response time for health check
  google.protobuf.Duration response_time = 4;
}
