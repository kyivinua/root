syntax = "proto3";

package company.user.v1;

option go_package = "github.com/kyivinua/root/proto/user/v1;userv1";

// UserProfile описывает базовые атрибуты пользователя.
//
// Структура используется в ответах методов UserService.
message UserProfile {
  // Уникальный идентификатор пользователя.
  //
  // Формат: UUID v4, строка, всегда задана.
  string id = 1;

  // Основной email пользователя.
  //
  // Формат: RFC 5321 / RFC 6531; используется как логин.
  string email = 2;

  // Имя пользователя в пользовательском интерфейсе.
  //
  // Отображается в UI и может быть изменено пользователем.
  string display_name = 3;

  // Статус пользователя в системе.
  UserStatus status = 4;

  // Временная отметка создания профиля в UTC (Unix timestamp в секундах).
  int64 created_at = 5;

  // Временная отметка последнего обновления профиля в UTC (Unix timestamp в секундах).
  int64 updated_at = 6;
}

// Статус пользователя в системе.
//
// Статус влияет на доступ к бизнес-функциям.
enum UserStatus {
  // Статус не указан (значение по умолчанию).
  USER_STATUS_UNSPECIFIED = 0;

  // Пользователь активен.
  USER_STATUS_ACTIVE = 1;

  // Пользователь деактивирован.
  USER_STATUS_INACTIVE = 2;

  // Пользователь заблокирован (например, из-за нарушения правил).
  USER_STATUS_BLOCKED = 3;
}
