hld_generator:
  enabled: true
  version: "7.0"
  default_mode: "ultra_advanced"

  # === Intelligence (Multi-Agent) ===
  intelligence:
    reasoning:
      type: "cot_xml"
      depth: 3
    self_critique: true
    multi_agent:
      enabled: true
      agents:
        - role: "architect"
          model: "claude-3-5-sonnet-20241022"
          temperature: 0.05
          weight: 0.30
          max_tokens: 8192
        - role: "pm"
          model: "claude-3-5-sonnet-20241022"
          temperature: 0.1
          weight: 0.15
          max_tokens: 4096
        - role: "security"
          model: "claude-3-5-sonnet-20241022"
          temperature: 0.0
          weight: 0.25
          max_tokens: 4096
        - role: "sre"
          model: "claude-3-5-sonnet-20241022"
          temperature: 0.05
          weight: 0.20
          max_tokens: 4096
        - role: "qa"
          model: "claude-3-5-sonnet-20241022"
          temperature: 0.1
          weight: 0.10
          max_tokens: 2048
        - role: "critic"
          model: "claude-3-haiku-20240307"
          temperature: 0.0
          max_tokens: 2000
    consensus_threshold: 0.88
    auto_refinement: true
    hallucination_mitigation: "rag+judge+entropy"
    quality_gates:
      consistency_score: 0.88
      business_value_coverage: 0.90
      security_coverage: 0.95

  # === Refinement Loop ===
  refinement:
    max_rounds: 3
    consensus_threshold: 0.88
    min_improvement_per_round: 0.05
    critical_issue_override: true
    fallback_on_stagnation: true
    enable_self_reflection: false
    final_validation: true

  # === Context Engine ===
  context:
    enabled: false  # Simplified for prototype
    sources: []
    rag:
      enabled: false

  # === Style ===
  style:
    preset: "stripe"
    custom:
      enabled: false

  # === DSL ===
  dsl:
    enabled: true
    syntax_highlighting: true
    extensions:
      mermaid: true
      plantuml: true
      kroki: true
      admonitions: true
      tabs: true
      callouts: true
      icons: true
      anchors: true
      expandable_sections: true

  # === LLM ===
  llm:
    router:
      strategy: "quality_first"
    providers:
      - name: "anthropic"
        model: "claude-3-5-sonnet-20241022"
        weight: 1.0
        temperature: 0.05
        max_tokens: 8192
        api_key: "${ANTHROPIC_API_KEY}"
    fallback_chain: ["anthropic"]

  # === Output ===
  output:
    formats:
      - "markdown"
    confluence:
      enabled: false
    git:
      commit_enabled: false
      path: "api-docs/hld/"
      branch: "main"

  # === Performance ===
  performance:
    concurrency: 10
    batch_size: 8
    timeout_seconds: 300
    rate_limit:
      rps: 15
      burst: 30

  # === Cache ===
  cache:
    primary: "memory"
    ttl:
      hld: "168h"

  # === Observability ===
  observability:
    tracing:
      enabled: false
    metrics:
      enabled: false
    logging:
      level: "info"
      include_prompt: false
      include_response: false

  # === Security ===
  security:
    pii_detection: "basic"
    secret_detection: true
    allowed_domains:
      - "company.com"
    content_policy:
      block_patterns: []
      require_approval_for_custom_prompts: false
