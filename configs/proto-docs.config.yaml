proto_root: "./proto"
use_buf: true

lint:
  enable_buf_lint: true
  enable_comments_check: true

breaking:
  enable: true
  target: ".git#branch=main"

enrichment:
  enabled: false  # Set to true to enable LLM enrichment
  config_path: "configs/enricher.config.yaml"
  manifest_path: "api-docs/enrichment-manifest.json"
  tenant: "default"
  output_model_path: "api-docs/model/api-doc-model-enriched.json"

notifications:
  enabled: false  # Set to true to enable notifications
  slack:
    enabled: false
    # webhook_url: ""  # Set via SLACK_WEBHOOK_URL environment variable
    # bot_token: ""    # Set via SLACK_BOT_TOKEN environment variable (alternative to webhook)
    # channel: "#proto-docs"  # Set via SLACK_CHANNEL environment variable
    username: "ProtoDocs Bot"
    icon_emoji: ":book:"
    notify_on_start: true
    notify_on_complete: true
    notify_on_failure: true
    notify_on_breaking: true
    notify_on_enrichment: true
    notify_release_notes: false
    # release_notes_version: "v1.0.0"  # Optional: version for release notes
    # release_notes_from_ref: "v0.9.0"  # Optional: compare from this ref

descriptors:
  output_path: "api-docs/descriptors/image.bin"

docs:
  output_format: "markdown"
  output_dir: "./api-docs/proto-docs"
  visibility_filter: ["PUBLIC", "PARTNER"]

openapi:
  enabled: true
  plugin: "openapiv3"
  output_dir: "./api-docs/openapi"
  visibility_filter: ["PUBLIC"]

diagrams:
  enabled: true
  output_dir: "./api-docs/diagrams"

  # Enable/disable specific diagram types
  enable_pipeline: true           # Pipeline architecture flowchart
  enable_enricher: true           # Enricher orchestration flowchart
  enable_component: true          # Component interaction graph
  enable_transform: true          # Proto → Doc transformation flowchart
  enable_deploy: true             # Deployment architecture graph
  enable_data_model: true         # Data model ER diagram
  enable_service_map: true        # Service relationship map
  enable_message_hierarchy: false # Message hierarchy (can be very large)

  # Generation settings
  generate_index: true            # Generate README.md index
  theme: "default"                # Mermaid theme: default, forest, dark, neutral
  max_services_per_diagram: 20    # Limit services in service map
  max_messages_per_diagram: 30    # Limit messages in message hierarchy

site:
  generator: "mkdocs"
  config_path: "./docs-site/mkdocs.yml"
  output_dir: "./api-docs/site"
